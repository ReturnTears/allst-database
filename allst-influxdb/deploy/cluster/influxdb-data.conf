# Enterprise 1.x data 节点示例。数据副本数不写在这里，写在保留策略的 REPLICATION 上。
# 应用访问数据节点的 8086。8088 是备份和 influxd-ctl 使用的 bind 地址。

reporting-disabled = true

[meta]
  dir = "/var/lib/influxdb/meta"

[data]
  dir = "/var/lib/influxdb/data"
  wal-dir = "/var/lib/influxdb/wal"
  index-version = "tsi1"
  cache-max-memory-size = "1g"
  max-series-per-database = 1000000
  max-values-per-tag = 100000

[cluster]
  write-timeout = "10s"
  shard-writer-timeout = "5s"

[http]
  enabled = true
  bind-address = ":8086"
  auth-enabled = true
  max-body-size = 25000000

[coordinator]
  write-timeout = "10s"
  query-timeout = "60s"
  log-queries-after = "1s"

# 数据节点加入已有 meta 集群：
# influxd-ctl add-data data-1:8088
# 保留策略的 REPLICATION 不要大于数据节点数量。OSS 必须是 1。
