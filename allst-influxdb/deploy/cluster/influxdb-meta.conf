# Enterprise 1.x meta 节点示例。OSS 的 influxd 不会按这个文件组成集群。
# 官方安装说明：https://docs.influxdata.com/enterprise_influxdb/v1.8/introduction/installation/
# meta 节点保持奇数，常见是 3 个。hostname 用节点自己的名字，三台文件不要互相复制后不改 hostname。

reporting-disabled = true

[meta]
  dir = "/var/lib/influxdb/meta"
  bind-address = ":8089"
  http-bind-address = ":8091"
  hostname = "meta-1"

# 第一台启动后，在能访问它的机器上执行：
# influxd-ctl add-meta meta-2:8091
# influxd-ctl add-meta meta-3:8091
# influxd-ctl show
