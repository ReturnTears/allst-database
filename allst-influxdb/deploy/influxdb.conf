# InfluxDB 1.8 调优参考。
# 不要拿这份文件直接覆盖镜像里的 /etc/influxdb/influxdb.conf。
# 先从容器里把原文件拷出来，再按这里的键合并。省略的键会使用 influxd 的编译默认值，但不同小版本默认值不完全一样。
# 本地演示优先用 deploy/docker-compose.yml 里的环境变量。

reporting-disabled = true

[meta]
  dir = "/var/lib/influxdb/meta"

[data]
  dir = "/var/lib/influxdb/data"
  wal-dir = "/var/lib/influxdb/wal"
  # TSI 把 series 索引放到磁盘上，series 多了以后比 in-memory 索引稳。
  index-version = "tsi1"
  cache-max-memory-size = "1g"
  cache-snapshot-memory-size = "25m"
  cache-snapshot-write-cold-duration = "10m"
  compact-full-write-cold-duration = "4h"
  max-series-per-database = 1000000
  max-values-per-tag = 100000

[coordinator]
  write-timeout = "10s"
  max-concurrent-queries = 0
  query-timeout = "60s"
  log-queries-after = "1s"
  max-select-point = 0
  max-select-series = 0
  max-select-buckets = 0

[retention]
  enabled = true
  check-interval = "30m"

[shard-precreation]
  enabled = true
  check-interval = "10m"
  advance-period = "30m"

[monitor]
  store-enabled = true
  store-database = "_internal"
  store-interval = "10s"

[http]
  enabled = true
  bind-address = ":8086"
  auth-enabled = true
  log-enabled = true
  write-tracing = false
  pprof-enabled = true
  max-body-size = 25000000
  max-concurrent-write-limit = 0
  max-enqueued-write-limit = 0

[logging]
  format = "auto"
  level = "info"

[continuous_queries]
  enabled = true
  log-enabled = true
  query-stats-enabled = false
  # 调度间隔。真正的桶大小由 CQ 里的 GROUP BY time 决定。
  run-interval = "1s"

[subscriber]
  enabled = true
