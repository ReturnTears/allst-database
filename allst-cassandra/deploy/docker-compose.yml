# 单节点，给本模块的接口直接连。
# 在 allst-cassandra 目录执行：docker compose -f deploy/docker-compose.yml up -d
# 第一次启动要一两分钟。Docker Desktop 建议至少给 2GB 内存。
services:
  cassandra:
    image: cassandra:4.1
    container_name: allst-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: allst-cassandra
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 16
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 60s
    volumes:
      - cassandra-data:/var/lib/cassandra

volumes:
  cassandra-data:
