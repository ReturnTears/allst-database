# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/test?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
# MongoDB
spring.data.mongodb.host=127.0.0.1
# \u4F7F\u7528mongo.conf\u6587\u4EF6\u542F\u52A8\u65F6\uFF0Cport\u914D\u7F6E\u7684\u4E3A27017\uFF0C \u76F4\u63A5\u542F\u52A8\u65F6\u9ED8\u8BA4\u7AEF\u53E3\u914D\u7F6E\u7684\u4E3A37017
spring.data.mongodb.port=27017
# \u6570\u636E\u5E93\u540D
spring.data.mongodb.database=admin
spring.data.mongodb.username=admin
spring.data.mongodb.password=123456

# ---------- JPA 指南场景（旧的数据源、Mongo 配置保持原样） ----------
# 练习库使用 update，启动时补齐 guide 前缀表。生产环境应改为 validate，并用迁移脚本建表。
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128
spring.jpa.properties.hibernate.generate_statistics=false
# Spring Boot 2 默认即 CamelCase -> snake_case。显式写出，避免被局部配置覆盖后难以回溯。
spring.jpa.hibernate.naming.physical-strategy=org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# 连接池与事务超时。事务只是从池里借连接，提交或回滚后必须归还。
spring.datasource.hikari.pool-name=allst-jpa
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.transaction.default-timeout=30

# 只导出标注了 @RepositoryRestResource 的仓库，避免把旧的 UsersRepository 一并暴露出去。
spring.data.rest.base-path=/api
spring.data.rest.detection-strategy=annotated
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=200

# Redis / Elasticsearch 默认不创建连接。需要时加 spring.profiles.active=redis 或 elasticsearch。
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

