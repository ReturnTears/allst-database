          url: "jdbc:mysql://localhost:3306/dyn_rw_slave_2?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=Asia/Shanghai"
          username: root
          password:
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            initialization-fail-timeout: -1
            min-idle: 0
            max-pool-size: 5
            connection-timeout: 3000
        orderShard0:
