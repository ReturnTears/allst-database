mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
server:
  port: 8000
  servlet:
    context-path: /dynamic
# 方式二（推荐）：只关闭自动配置报告，保留其他 debug 能力
logging:
  level:
    org.springframework.boot.autoconfigure: INFO

# 灰度策略启动时的默认值。运行中可通过 PUT /scenario/gray/policy 修改，重启后回到这里。
allst:
  datasource:
    gray:
      percent: 0
      allow-users: []
