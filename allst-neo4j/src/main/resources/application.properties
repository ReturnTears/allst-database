# noe4j
spring.data.neo4j.username=neo4j
spring.data.neo4j.password=hadoop
spring.data.neo4j.uri=bolt://127.0.0.1:7687

# 规范示例走 Neo4j 4.3 HTTP API，避免和旧 OGM 的 Bolt 驱动 1.7 冲突
allst.neo4j.http-uri=http://127.0.0.1:7474
allst.neo4j.database=neo4j
allst.neo4j.username=neo4j
allst.neo4j.password=hadoop
allst.neo4j.connect-timeout-ms=3000
allst.neo4j.read-timeout-ms=20000

spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
spring.mvc.pathmatch.use-suffix-pattern=false
spring.mvc.pathmatch.use-registered-suffix-pattern=false

